name: Build and Release

# Triggered directly by the version tag. This used to chain off the
# "Auto-update Docs" workflow via workflow_run — that workflow generated
# src/docs/*.md and, as a side effect, was the only thing that started a
# release. Its backend (GitHub Models) was retired, the docs it produced went
# four releases stale, and the wiki that replaced them is generated locally,
# so it has been deleted. Releasing must not depend on a docs job at all.
on:
  push:
    tags:
      - 'v*'

# Least privilege by default. Without this the token handed to every job is
# whatever the repository default happens to be — which is write access to the
# whole repo for jobs that only need to read it. The two build jobs raise
# themselves to `contents: write` because they upload release assets; the test
# gate, which only checks out and runs tests, now cannot write anything at all.
# Any job added later starts read-only rather than inheriting write silently.
permissions:
  contents: read

jobs:
  # ── Test gate: lint + unit tests + the real-app e2e suite ───────────────────
  # Runs once; both build jobs below wait on it and only proceed if it's green.
  # windows-latest (not ubuntu) because the e2e suite drives the actual
  # Electron app and needs a real interactive desktop session to open windows
  # in — see e2e/support/electron-app.js and ci.yml's own e2e job for the
  # same reasoning.
  test-gate:
    name: Test gate (lint + unit + e2e)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Full install (not --ignore-scripts): postinstall rebuilds the native
      # sqlite3 module for Electron, which the e2e suite launches for real.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # e2e fixtures are DB-backed, but the app still opens sde.sql at
      # startup (initSde()) — needs the real SDE, not an empty stub.
      - name: Fetch SDE
        run: node scripts/fetch-sde.js

      - name: Create .env
        shell: bash
        run: cp .env.example .env

      - name: End-to-end tests (real Electron app)
        run: npm run test:e2e

      - name: Upload e2e failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-test-results
          path: test-results/
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    needs: test-gate
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Full install (not --ignore-scripts): the "Fetch SDE" step below runs
      # scripts/fetch-sde.js in plain Node, which requires the native sqlite3
      # binary that npm's install scripts fetch (an N-API prebuilt that serves
      # both Node and Electron). --ignore-scripts skipped it, so Fetch SDE
      # crashed with exit 1 and no installer was ever built.
      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        # shell: bash, ALWAYS. Windows runners default to PowerShell, where the
        # `if [ -z ... ]` below is a parse error — which is exactly how v3.0.0
        # shipped a .dmg and no .exe: this step died before the build ran, while
        # the macOS job (bash by default) sailed through. Every other multi-line
        # step in this file already declares it.
        shell: bash
        run: |
          echo "EVE_CLIENT_ID=${{ secrets.EVE_CLIENT_ID }}" >> .env
          echo "PRESENCE_URL=${{ secrets.PRESENCE_URL }}" >> .env
          # An unset secret substitutes to an empty string, which ships a build
          # whose online counter silently never appears. Say so in the summary.
          if [ -z "${{ secrets.PRESENCE_URL }}" ]; then
            echo "::warning::PRESENCE_URL secret is empty — this build ships with the online counter disabled."
          fi
          if [ -z "${{ secrets.EVE_CLIENT_ID }}" ]; then
            echo "::error::EVE_CLIENT_ID secret is empty — this build cannot authenticate."
          fi

      - name: Fetch SDE
        run: node scripts/fetch-sde.js

      - name: Build Windows exe
        run: npx electron-builder --win --x64 --publish never

      # Release notes = the CHANGELOG.md section MATCHING the tag being
      # released (## [x.y.z]), so every release gets its own notes. Falls back
      # to the newest section only if the tag has no dedicated entry —
      # previously this always took the top section, which stamped the same
      # stale notes onto every release.
      - name: Extract changelog section for this tag
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          TAG="$HEAD_BRANCH"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            /^## \[/ { on = (index($0, "## [" ver "]") == 1) }
            on
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! [ -s RELEASE_NOTES.md ]; then
            echo "No changelog section for $VER — falling back to newest section"
            awk '/^## \[/{c++} c==1' CHANGELOG.md > RELEASE_NOTES.md
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body_path: RELEASE_NOTES.md
          tag_name: ${{ github.ref_name }}
          # Publish as a STABLE release (not pre-release) so GitHub's
          # /releases/latest returns it — older installed clients check that
          # endpoint, which excludes pre-releases.
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    runs-on: macos-latest
    # Waits on the test gate, like build-windows. It never did: the only thing
    # sequencing it was the shared `if: workflow_run.conclusion == 'success'`
    # guard, which tested the DOCS run, not the tests — so a red test gate still
    # shipped a .dmg. The comment on test-gate has always claimed both builds
    # wait for it; now they do.
    needs: test-gate
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Full install (not --ignore-scripts): the "Fetch SDE" step below runs
      # scripts/fetch-sde.js in plain Node, which requires the native sqlite3
      # binary that npm's install scripts fetch (an N-API prebuilt that serves
      # both Node and Electron). --ignore-scripts skipped it, so Fetch SDE
      # crashed with exit 1 and no installer was ever built.
      - name: Install dependencies
        run: npm ci

      - name: Create .env file
        # shell: bash, ALWAYS. Windows runners default to PowerShell, where the
        # `if [ -z ... ]` below is a parse error — which is exactly how v3.0.0
        # shipped a .dmg and no .exe: this step died before the build ran, while
        # the macOS job (bash by default) sailed through. Every other multi-line
        # step in this file already declares it.
        shell: bash
        run: |
          echo "EVE_CLIENT_ID=${{ secrets.EVE_CLIENT_ID }}" >> .env
          echo "PRESENCE_URL=${{ secrets.PRESENCE_URL }}" >> .env
          # An unset secret substitutes to an empty string, which ships a build
          # whose online counter silently never appears. Say so in the summary.
          if [ -z "${{ secrets.PRESENCE_URL }}" ]; then
            echo "::warning::PRESENCE_URL secret is empty — this build ships with the online counter disabled."
          fi
          if [ -z "${{ secrets.EVE_CLIENT_ID }}" ]; then
            echo "::error::EVE_CLIENT_ID secret is empty — this build cannot authenticate."
          fi

      - name: Fetch SDE
        run: node scripts/fetch-sde.js

      # No Apple Developer cert in CI, so electron-builder must NOT try to discover
      # one — it should ad-hoc sign instead (mac.identity: null in package.json).
      # An arm64 app with no signature at all is killed silently by macOS on Apple
      # Silicon (no Gatekeeper prompt); ad-hoc signing lets it launch via right-click
      # → Open. Full Gatekeeper clearance needs a Developer ID + notarization.
      - name: Build macOS dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          tag_name: ${{ github.ref_name }}
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BEEHIVE EARLY WARNING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/base.css"/>
  <link rel="stylesheet" href="../styles/palette.css"/>
  <link rel="stylesheet" id="themeStylesheet" href="../styles/theme-default.css"/>
  <link rel="stylesheet" href="../styles/dashboard.css"/>
  <link rel="stylesheet" href="../styles/fc.css"/>
  <link rel="stylesheet" href="../styles/glass.css"/>
  <link rel="stylesheet" href="../styles/widget-window.css"/>
  <!-- The SAME row builder the Early Warning page uses, so this window
       cannot drift away from it. -->
  <script src="../shared/intel-row.js"></script>
  <script>
  // Same theme + glass restore the dashboard pop-outs do, so this window looks
  // like the rest of the app rather than a default-themed stranger.
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('eve-theme-css') || 'null');
      var link = document.getElementById('themeStylesheet');
      var GONE = { 'theme-carbon.css': 1, 'theme-sirius.css': 1 };
      if (t && link && !(t.file && GONE[t.file])) {
        if (t.file)      link.setAttribute('href', '../styles/' + t.file);
        else if (t.path) link.setAttribute('href', 'file:///' + encodeURI(t.path.replace(/\\/g, '/')));
      }
    } catch (e) {}
  })();
  </script>
</head>
<body>
  <script>
  (function () {
    try {
      var g = JSON.parse(localStorage.getItem('eve-glass') || 'null');
      if (!g || g.enabled !== false) {
        document.body.classList.add('glass-on');
        var r = document.documentElement.style;
        if (g && g._surfaceRgb)       r.setProperty('--glass-tint-rgb',   g._surfaceRgb);
        if (g && g.tintAlpha != null) r.setProperty('--glass-tint-alpha', g.tintAlpha);
        if (g && g.bgAlpha  != null)  r.setProperty('--glass-bg-alpha',   g.bgAlpha);
        if (g && g.blurScale != null) r.setProperty('--glass-blur-scale', g.blurScale);
      }
    } catch (e) {}
  })();
  </script>

  <div class="pw-titlebar">
    <span class="material-symbols-outlined pw-icon">radar</span>
    <span class="pw-title" id="iwTitle">EARLY WARNING</span>
    <button class="pw-btn" id="iwPinBtn" title="Keep on top of the game">
      <span class="material-symbols-outlined">keep</span>
    </button>
    <button class="pw-btn" id="iwCloseBtn" title="Close">
      <span class="material-symbols-outlined">close_fullscreen</span>
    </button>
  </div>

  <div class="iw-status" id="iwStatus">Connecting…</div>
  <div class="iw-list" id="iwList">
    <div class="pw-empty">Waiting for intel…</div>
  </div>

  <script>
  (function () {
    const REFRESH_MS = 2000;
    const listEl   = document.getElementById('iwList');
    const statusEl = document.getElementById('iwStatus');

    function render(contacts) {
      // Pilot tracks first — those carry a heading. Bare system reports only
      // earn a row when they're close enough to matter on their own.
      const rows = (contacts || []).filter(c => c.kind === 'pilot' || c.jumps <= 3);
      if (!rows.length) {
        listEl.innerHTML = '<div class="pw-empty">No contacts in range.</div>';
        return;
      }
      // compact drops the REGION column: it is the least actionable of the seven
      // and this window is deliberately narrow enough to sit beside the game.
      listEl.innerHTML = IntelRow.headerHtml({ compact: true })
        + rows.slice(0, 25)
              .map(c => IntelRow.rowHtml(c, { compact: true, relative: true }))
              .join('');
    }

    function paintStatus(st) {
      if (!st || !st.running) {
        statusEl.textContent = 'Not watching — start it on the Fleet Commander page';
        statusEl.className = 'iw-status iw-status-off';
        return;
      }
      const n = (st.origins || []).length;
      statusEl.textContent = n
        ? `Watching · ${n} character${n === 1 ? '' : 's'} · ${st.reach} systems`
        : 'Watching · NO POSITION MONITORED';
      statusEl.className = 'iw-status' + (n ? '' : ' iw-status-off');
    }

    let timer = null;
    async function tick() {
      try {
        const [contacts, st] = await Promise.all([
          window.eveAPI.intelContacts(),
          window.eveAPI.intelStatus(),
        ]);
        render(contacts);
        paintStatus(st);
      } catch (_) { /* main not ready yet — the next tick retries */ }
    }
    tick();
    timer = setInterval(tick, REFRESH_MS);

    // Alerts arrive by push rather than waiting for the next poll: two seconds
    // of a ninety-second budget is worth not spending.
    window.eveAPI?.on?.('intel-alert', (a) => {
      document.body.classList.remove('iw-flash');
      void document.body.offsetWidth;          // restart the animation
      document.body.classList.add('iw-flash');
      tick();
    });

    let pinned = false;
    document.getElementById('iwPinBtn').addEventListener('click', () => {
      pinned = !pinned;
      document.getElementById('iwPinBtn').classList.toggle('pinned', pinned);
      window.eveAPI?.intelWidgetPin?.(pinned);
    });
    document.getElementById('iwCloseBtn').addEventListener('click', () => {
      window.eveAPI?.intelWidgetClose?.();
    });
    window.addEventListener('beforeunload', () => { if (timer) clearInterval(timer); });
  })();
  </script>
</body>
</html>

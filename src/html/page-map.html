<!-- ── Map Page ───────────────────────────────────────────────────────────── -->
<div id="page-map" class="nav-page">
  <div class="page-header">
    <h2>Galaxy Map</h2>

    <!-- Toolbar -->
    <div class="map-toolbar">

      <!-- Overlay selector -->
      <div class="map-overlay-group" role="group" aria-label="Map overlay">
        <span class="map-group-label">OVERLAY</span>
        <button type="button" class="map-overlay-btn active" data-overlay="security" aria-pressed="true">Security</button>
        <button type="button" class="map-overlay-btn" data-overlay="sovereignty" aria-pressed="false">Sovereignty</button>
        <button type="button" class="map-overlay-btn" data-overlay="fnf" aria-pressed="false" title="Colour sov by your alliance's standings — blue (+5/+10), orange (−5), red (−10), NPC grey">Friends &amp; Foes</button>
        <button type="button" class="map-overlay-btn" data-overlay="incursions" aria-pressed="false">Incursions</button>
        <button type="button" class="map-overlay-btn" data-overlay="traffic" aria-pressed="false" title="Ship jumps through each system in the last hour (ESI, public)">Traffic</button>
        <button type="button" class="map-overlay-btn" data-overlay="kills" aria-pressed="false" title="Ships and pods killed in the last hour — where players are dying (ESI, public)">Danger</button>
        <button type="button" class="map-overlay-btn" data-overlay="ratting" aria-pressed="false" title="NPCs killed in the last hour — where the ratting is (ESI, public)">Ratting</button>
        <button type="button" class="map-overlay-btn" data-overlay="campaigns" aria-pressed="false" title="Active sovereignty campaigns and their timers (ESI, public)">Sov Timers</button>
        <button type="button" class="map-overlay-btn" data-overlay="fw" aria-pressed="false" title="Faction-warfare ownership and contested state (ESI, public)">Faction War</button>
        <button type="button" class="map-overlay-btn" data-overlay="industry" aria-pressed="false" title="Manufacturing cost index per system (ESI, public)">Industry</button>
      </div>

      <!-- View style (Classic / Modern). Modern = CCP-style flattened galaxy with
           uniform-pitch region clusters (see _buildGalaxyModern in map.js) plus the
           DOTLAN-style per-region view via the region picker. -->
      <div class="map-overlay-group" role="group" aria-label="Map view style">
        <span class="map-group-label">VIEW</span>
        <!-- Two views, because there are two questions: where things ARE, and what
             the numbers SAY. Classic was a third answer to neither — a flat
             top-down that was decluttered out of true position but not arranged
             for reading either. Its renderer is still in map.js (see _render)
             and can be brought back by restoring a button with data-view="classic";
             nothing else was removed. -->
        <button type="button" class="map-view-btn active" data-view="spatial" aria-pressed="true" title="Where things actually are — the SDE's own 3D coordinates through a real camera. Drag to orbit, shift-drag to pan, scroll to fly in.">Spatial</button>
        <button type="button" class="map-view-btn" data-view="modern" aria-pressed="false" title="Schematic — every region as a tidy cluster, stars moved onto a grid so the data is easy to read; pick a region for the detailed layout">Schematic</button>
      </div>

      <!-- Level of detail over the SAME arrangement, the way the in-game map's
           Layout control works: the galaxy stays put and the nodes merge, so
           you never lose your place stepping between them. Spatial only. -->
      <div class="map-overlay-group" role="group" aria-label="Map layout" id="mapLayoutGroup">
        <span class="map-group-label">LAYOUT</span>
        <button type="button" class="map-layout-btn active" data-layout="system" aria-pressed="true" title="Every solar system">System</button>
        <button type="button" class="map-layout-btn" data-layout="constellation" aria-pressed="false" title="One node per constellation, at the centre of its systems">Constellation</button>
        <button type="button" class="map-layout-btn" data-layout="region" aria-pressed="false" title="One node per region, at the centre of its systems">Region</button>
        <button type="button" class="map-flat-btn" id="mapFlatBtn" aria-pressed="false" title="Flat — look straight down with no perspective, so position never depends on depth">Flat</button>
      </div>

      <!-- Region picker — the Modern-view JS shows/hides this as the view switches -->
      <select id="mapRegionSelect" class="map-region-select" aria-label="Region to lay out" title="Pick a region to lay out (Modern view)"></select>

      <!-- Layer toggles. Icons are Material Symbols in the shared 18px slot — the
           app's two sanctioned icon families are Material (app utility) and the
           EVE neocom sprite (game concepts); no emoji in the chrome. -->
      <button type="button" class="map-toggle-btn" id="mapJbToggle" aria-pressed="false" title="Show your jump-bridge network (green arcs) and IHUB systems">
        <span class="material-symbols-outlined" aria-hidden="true">hub</span>Jump Bridges
      </button>

      <!-- Wormhole connections toggle (EvE-Scout public API) -->
      <button type="button" class="map-toggle-btn" id="mapWhToggle" aria-pressed="false" title="Show EvE-Scout wormhole connections (public API) as dark-purple arcs">
        <span class="material-symbols-outlined" aria-hidden="true">cyclone</span>Wormholes
      </button>

      <!-- Influence field (Verite-style territory blobs under the systems) -->
      <button type="button" class="map-toggle-btn" id="mapInfToggle" aria-pressed="false"
              title="Glowing territory field — sov influence spreads out along gates and neighbours merge into one shape. Follows the active overlay: alliance colours normally, your standings under Friends &amp; Foes. Galaxy views only (not inside a region)">
        <span class="material-symbols-outlined" aria-hidden="true">blur_on</span>Influence
      </button>

      <!-- Route planners. These open a modal rather than toggling a layer, so they
           carry .map-planner-btn and never take the toggles' lit .active state. -->
      <button type="button" class="map-toggle-btn map-planner-btn" id="mapJumpPlannerBtn" onclick="openJumpPlanner()"
              title="Plan a capital jump route (cyno or beacon network)">
        <span class="material-symbols-outlined" aria-hidden="true">rocket_launch</span>Jump Planner…
      </button>

      <!-- Stargate route planner -->
      <button type="button" class="map-toggle-btn map-planner-btn" id="mapStargatePlannerBtn" onclick="openStargatePlanner()"
              title="Plan a sub-cap stargate route (safest by alliance standings)">
        <span class="material-symbols-outlined" aria-hidden="true">explore</span>Stargate Planner…
      </button>

      <!-- System search -->
      <div class="map-search-wrap">
        <input id="mapSearchInput" type="text"
               class="map-search-input"
               placeholder="Find system…"
               aria-label="Find system"
               role="combobox"
               aria-expanded="false"
               aria-controls="mapSearchResults"
               aria-autocomplete="list"
               autocomplete="off"
               spellcheck="false" />
        <div id="mapSearchResults" class="map-search-results is-hidden" role="listbox" aria-label="Matching systems"></div>
      </div>
    </div>

    <button type="button" class="close-page-btn" onclick="closePage('map')" aria-label="Close the Galaxy Map">✕</button>
  </div>

  <!-- Map viewport fills all remaining space -->
  <div class="map-viewport" id="mapViewport">

    <!-- Loading spinner (visible until SDE data is ready) -->
    <div class="map-loading is-hidden" id="mapLoading" role="status" aria-live="polite">
      <div class="map-loading-spinner"></div>
      <div class="map-loading-text">Loading galaxy data…</div>
    </div>

    <!-- Galaxy-load failure. Replaces the loading overlay rather than sitting under
         it: a spinner that keeps turning under an error reads as "still working". -->
    <div class="map-error is-hidden" id="mapError" role="alert">
      <div class="empty-state">
        <div class="empty-icon" aria-hidden="true">⚠</div>
        <div class="empty-title">The galaxy didn't load</div>
        <div class="empty-sub">
          The map is drawn from the bundled Static Data Export. Without it there is
          nothing to render.
          <span class="map-error-cause" id="mapErrorCause"></span>
        </div>
        <div class="map-error-actions">
          <button type="button" class="map-error-btn" id="mapErrorRetry">Try again</button>
          <button type="button" class="map-error-btn map-error-btn-quiet" id="mapErrorSettings">Open database settings</button>
        </div>
      </div>
    </div>

    <!-- Main canvas — sized to parent by ResizeObserver in map.js -->
    <canvas id="mapCanvas"></canvas>

    <!-- Floating tooltip (system name on hover) -->
    <div id="mapTooltip"></div>

    <!-- System info panel (shown on click) -->
    <div class="map-info-panel is-hidden" id="mapInfoPanel">
      <div class="map-info-header">
        <span id="mapInfoSystemName">—</span>
        <button type="button" class="map-info-close" onclick="mapCloseInfo()" aria-label="Close system details">✕</button>
      </div>
      <div class="map-info-body" id="mapInfoBody"></div>
    </div>

    <!-- Zoom controls (bottom-right) -->
    <div class="map-zoom-controls">
      <button type="button" class="map-zoom-btn" id="mapZoomIn"  title="Zoom in"  aria-label="Zoom in">+</button>
      <button type="button" class="map-zoom-btn" id="mapZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
      <button type="button" class="map-zoom-btn map-zoom-btn-icon" id="mapZoomFit" title="Fit galaxy to view" aria-label="Fit galaxy to view">
        <span class="material-symbols-outlined" aria-hidden="true">fit_screen</span>
      </button>
    </div>

    <!-- Colour legend (bottom-left) -->
    <div class="map-legend" id="mapLegend"></div>

  </div>
</div>

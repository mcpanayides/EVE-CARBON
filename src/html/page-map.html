<!-- ── Map Page ───────────────────────────────────────────────────────────── -->
<div id="page-map" class="nav-page">
  <div class="page-header">
    <h2>Galaxy Map</h2>

    <!-- Toolbar: one row, read left to right. How you look at the galaxy (View,
         then Layout in Spatial or Region in Schematic), what it shows (Overlay,
         Layers), and what you do (Plan, Find). The two big sets, eleven overlays
         and four layers, open as menus under their labelled triggers, and each
         trigger names what's on, so nothing that belongs together can wrap apart.
         Menus are disclosures over toggle buttons (aria-expanded on the trigger,
         aria-pressed on each button); src/func/map.js drives them. -->
    <div class="map-toolbar">

      <!-- Two views, because there are two questions: where things ARE, and what
           the numbers SAY. Classic was a third answer to neither. Its renderer is
           still in map.js (see _render) and can be brought back by restoring a
           button with data-view="classic"; nothing else was removed. -->
      <!-- The one group without a label cell: "Spatial | Schematic" says what it is. -->
      <div class="map-overlay-group" role="group" aria-label="Map view">
        <button type="button" class="map-view-btn active" data-view="spatial" aria-pressed="true" title="Where things actually are — the SDE's own 3D coordinates through a real camera. Drag to orbit the selected system, or Rens in the middle of New Eden when nothing is selected (the point under the cursor once Rens is out of view). Right-drag, or hold Space and drag, to pan; scroll to fly in; F to refit.">Spatial</button>
        <button type="button" class="map-view-btn" data-view="modern" aria-pressed="false" title="Schematic — every region as a tidy cluster, stars moved onto a grid so the data is easy to read; pick a region for the detailed layout">Schematic</button>
      </div>

      <!-- Layout (Spatial only): level of detail over the SAME arrangement, the way
           the in-game map's Layout control works. The galaxy stays put and the
           nodes merge, so you never lose your place stepping between them. -->
      <div class="map-menu" id="mapLayoutGroup">
        <button type="button" class="map-menu-trigger" id="mapLayoutTrigger" aria-expanded="false" aria-controls="mapLayoutMenu">
          <span class="map-group-label">LAYOUT</span>
          <span class="map-menu-value" id="mapLayoutValue">System</span>
          <span class="material-symbols-outlined map-menu-chevron" aria-hidden="true">expand_more</span>
        </button>
        <div class="map-menu-panel" id="mapLayoutMenu" tabindex="-1" hidden>
          <div role="group" aria-label="Map layout">
            <button type="button" class="map-menu-item map-layout-btn active" data-layout="system" aria-pressed="true">
              <span class="map-menu-text"><span class="map-menu-name">System</span><span class="map-menu-desc">Every solar system</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-layout-btn" data-layout="constellation" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Constellation</span><span class="map-menu-desc">One node per constellation, at the centre of its systems</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-layout-btn" data-layout="region" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Region</span><span class="map-menu-desc">One node per region, at the centre of its systems</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
          </div>
          <div class="map-menu-rule" aria-hidden="true"></div>
          <button type="button" class="map-menu-item is-switch" id="mapFlatBtn" aria-pressed="false">
            <span class="map-menu-text"><span class="map-menu-name">Flat</span><span class="map-menu-desc">Straight down with no perspective, so position never depends on depth</span></span>
            <span class="map-menu-switch" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <!-- Region (Schematic only): the galaxy overview, or one region laid out. -->
      <label class="map-select-group" id="mapRegionGroup" hidden>
        <span class="map-group-label">REGION</span>
        <select id="mapRegionSelect" class="map-region-select" aria-label="Region to lay out"></select>
      </label>

      <!-- Overlay: what the stars' colours mean. One at a time. -->
      <div class="map-menu" id="mapOverlayGroup">
        <button type="button" class="map-menu-trigger" id="mapOverlayTrigger" aria-expanded="false" aria-controls="mapOverlayMenu">
          <span class="map-group-label">OVERLAY</span>
          <span class="map-menu-value" id="mapOverlayValue">Natural</span>
          <span class="material-symbols-outlined map-menu-chevron" aria-hidden="true">expand_more</span>
        </button>
        <div class="map-menu-panel" id="mapOverlayMenu" tabindex="-1" hidden>
          <div role="group" aria-label="Map overlay">
            <div class="map-menu-heading" aria-hidden="true">Stars</div>
            <button type="button" class="map-menu-item map-overlay-btn active" data-overlay="natural" aria-pressed="true">
              <span class="map-menu-text"><span class="map-menu-name">Natural</span><span class="map-menu-desc">Every system as its own star, by its real star type</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="security" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Security</span><span class="map-menu-desc">Security status, high-sec to null</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <div class="map-menu-heading" aria-hidden="true">Territory</div>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="sovereignty" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Sovereignty</span><span class="map-menu-desc">Who holds each system</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="fnf" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Friends &amp; Foes</span><span class="map-menu-desc">Sov by your alliance's standings: blue friends, orange and red foes, NPC grey</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="fw" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Faction War</span><span class="map-menu-desc">Warzone ownership and contested systems</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="campaigns" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Sov Timers</span><span class="map-menu-desc">Sovereignty campaigns and their timers</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <div class="map-menu-heading" aria-hidden="true">Last hour</div>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="traffic" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Traffic</span><span class="map-menu-desc">Ship jumps through each system</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="kills" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Danger</span><span class="map-menu-desc">Ships and pods killed: where pilots are dying</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="ratting" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Ratting</span><span class="map-menu-desc">NPCs killed: where the ratting is</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <div class="map-menu-heading" aria-hidden="true">PvE and industry</div>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="incursions" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Incursions</span><span class="map-menu-desc">Where Sansha incursions are running</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
            <button type="button" class="map-menu-item map-overlay-btn" data-overlay="industry" aria-pressed="false">
              <span class="map-menu-text"><span class="map-menu-name">Industry</span><span class="map-menu-desc">Manufacturing cost index per system</span></span>
              <span class="material-symbols-outlined map-menu-check" aria-hidden="true">check</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Layers: drawn over whichever overlay is on, any number at once. The
           trigger shows the glyph of every layer that's on. Icons are Material
           Symbols: the app's two icon families are Material (app utility) and
           the EVE neocom sprite (game concepts); no emoji in the chrome. -->
      <div class="map-menu" id="mapLayersGroup">
        <button type="button" class="map-menu-trigger" id="mapLayersTrigger" aria-expanded="false" aria-controls="mapLayersMenu">
          <span class="map-group-label">LAYERS</span>
          <span class="map-menu-value map-layers-on" id="mapLayersValue"></span>
          <span class="material-symbols-outlined map-menu-chevron" aria-hidden="true">expand_more</span>
        </button>
        <div class="map-menu-panel" id="mapLayersMenu" tabindex="-1" hidden>
          <div role="group" aria-label="Map layers">
            <button type="button" class="map-menu-item is-switch" id="mapJbToggle" data-layer="bridges" aria-pressed="false">
              <span class="material-symbols-outlined map-menu-icon" aria-hidden="true">hub</span>
              <span class="map-menu-text"><span class="map-menu-name">Jump bridges</span><span class="map-menu-desc">Yours in green, other alliances' dashed red, and IHUB systems</span></span>
              <span class="map-menu-switch" aria-hidden="true"></span>
            </button>
            <button type="button" class="map-menu-item is-switch" id="mapWhToggle" data-layer="wormholes" aria-pressed="false">
              <span class="material-symbols-outlined map-menu-icon" aria-hidden="true">cyclone</span>
              <span class="map-menu-text"><span class="map-menu-name">Wormholes</span><span class="map-menu-desc">Thera and Turnur connections, from EvE&#8209;Scout</span></span>
              <span class="map-menu-switch" aria-hidden="true"></span>
            </button>
            <button type="button" class="map-menu-item is-switch" id="mapInfToggle" data-layer="influence" aria-pressed="false">
              <span class="material-symbols-outlined map-menu-icon" aria-hidden="true">blur_on</span>
              <span class="map-menu-text"><span class="map-menu-name">Influence</span><span class="map-menu-desc">Sov as a glowing territory field, in the overlay's colours. Galaxy views only</span></span>
              <span class="map-menu-switch" aria-hidden="true"></span>
            </button>
            <button type="button" class="map-menu-item is-switch" id="mapFpToggle" data-layer="projection" aria-pressed="false">
              <span class="material-symbols-outlined map-menu-icon" aria-hidden="true">radar</span>
              <span class="map-menu-text"><span class="map-menu-name">Force projection</span><span class="map-menu-desc">Ansiblex fare zones within 20 LY of a sov capital. Pick alliances top-left</span></span>
              <span class="map-menu-switch" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>

      <!-- Route planners. Each opens its planner, so the labels end in an ellipsis
           and nothing here ever stays lit. -->
      <div class="map-overlay-group" role="group" aria-label="Plan a route">
        <span class="map-group-label">PLAN</span>
        <button type="button" class="map-plan-btn" id="mapJumpPlannerBtn" onclick="openJumpPlanner()"
                title="Plan a capital jump route (cyno or beacon network)">Jump…</button>
        <button type="button" class="map-plan-btn" id="mapStargatePlannerBtn" onclick="openStargatePlanner()"
                title="Plan a sub-cap stargate route (safest by alliance standings)">Stargate…</button>
      </div>

      <!-- System search -->
      <div class="map-search-wrap">
        <input id="mapSearchInput" type="text"
               class="map-search-input"
               placeholder="Find system…"
               aria-label="Find system"
               role="combobox"
               aria-expanded="false"
               aria-controls="mapSearchResults"
               aria-autocomplete="list"
               autocomplete="off"
               spellcheck="false" />
        <div id="mapSearchResults" class="map-search-results is-hidden" role="listbox" aria-label="Matching systems"></div>
      </div>
    </div>

    <button type="button" class="close-page-btn" onclick="closePage('map')" aria-label="Close the Galaxy Map">✕</button>
  </div>

  <!-- Map viewport fills all remaining space -->
  <div class="map-viewport" id="mapViewport">

    <!-- Loading spinner (visible until SDE data is ready) -->
    <div class="map-loading is-hidden" id="mapLoading" role="status" aria-live="polite">
      <div class="map-loading-spinner"></div>
      <div class="map-loading-text">Loading galaxy data…</div>
    </div>

    <!-- Galaxy-load failure. Replaces the loading overlay rather than sitting under
         it: a spinner that keeps turning under an error reads as "still working". -->
    <div class="map-error is-hidden" id="mapError" role="alert">
      <div class="empty-state">
        <div class="empty-icon" aria-hidden="true">⚠</div>
        <div class="empty-title">The galaxy didn't load</div>
        <div class="empty-sub">
          The map is drawn from the bundled Static Data Export. Without it there is
          nothing to render.
          <span class="map-error-cause" id="mapErrorCause"></span>
        </div>
        <div class="map-error-actions">
          <button type="button" class="map-error-btn" id="mapErrorRetry">Try again</button>
          <button type="button" class="map-error-btn map-error-btn-quiet" id="mapErrorSettings">Open database settings</button>
        </div>
      </div>
    </div>

    <!-- Spatial backdrop — skybox and drifting region nebulae — under the map, so
         the clouds move without the map redrawing. Never takes the mouse. -->
    <canvas id="mapBgCanvas" class="is-hidden" aria-hidden="true"></canvas>

    <!-- Main canvas — sized to parent by ResizeObserver in map.js -->
    <canvas id="mapCanvas"></canvas>
    <!-- A newly plotted route drawing itself in, hop by hop: on a layer of its
         own until it lands, when the map takes it back. Never takes the mouse. -->
    <canvas id="mapRouteCanvas" aria-hidden="true"></canvas>
    <!-- Bridge shimmer: animated on a layer of its own, so the map itself never
         has to redraw to move it. Never takes the mouse. -->
    <canvas id="mapFxCanvas" aria-hidden="true"></canvas>
    <!-- Spatial dust, twinkle and lens flares, over everything: the dust hangs
         in front of the lens and the flares are in it. Its own layer for the
         same reason. Never takes the mouse. -->
    <canvas id="mapSkyCanvas" aria-hidden="true"></canvas>

    <!-- Floating tooltip (system name on hover) -->
    <div id="mapTooltip"></div>

    <!-- System info panel (shown on click) -->
    <div class="map-info-panel is-hidden" id="mapInfoPanel">
      <div class="map-info-header">
        <span id="mapInfoSystemName">—</span>
        <button type="button" class="map-info-close" onclick="mapCloseInfo()" aria-label="Close system details">✕</button>
      </div>
      <div class="map-info-body" id="mapInfoBody"></div>
    </div>

    <!-- Zoom controls (bottom-right) -->
    <div class="map-zoom-controls">
      <button type="button" class="map-zoom-btn" id="mapZoomIn"  title="Zoom in"  aria-label="Zoom in">+</button>
      <button type="button" class="map-zoom-btn" id="mapZoomOut" title="Zoom out" aria-label="Zoom out">−</button>
      <button type="button" class="map-zoom-btn map-zoom-btn-icon" id="mapZoomFit" title="Fit galaxy to view" aria-label="Fit galaxy to view">
        <span class="material-symbols-outlined" aria-hidden="true">fit_screen</span>
      </button>
    </div>

    <!-- Colour legend (bottom-left) -->
    <div class="map-legend" id="mapLegend"></div>

    <!-- Solar system view. The system's name card, top-left
         while inside it, and the way in and out, bottom-centre: "View solar
         system" over the map, the way back inside one. -->
    <div class="map-sys-hud is-hidden" id="mapSysHud" aria-live="polite">
      <div class="map-sys-hud-name" id="mapSysHudName"></div>
      <div class="map-sys-hud-meta" id="mapSysHudMeta"></div>
      <div class="map-sys-hud-count" id="mapSysHudCount"></div>
      <div class="map-sys-hud-route" id="mapSysHudRoute"></div>
    </div>
    <button type="button" class="map-sys-btn is-hidden" id="mapSysBtn">
      <span class="material-symbols-outlined" aria-hidden="true">orbit</span>
      <span class="map-sys-btn-label">View solar system</span>
    </button>

  </div>
</div>

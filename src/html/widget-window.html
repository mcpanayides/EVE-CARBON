<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EVE Carbon Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/base.css"/>
  <link rel="stylesheet" href="../styles/palette.css"/>
  <!-- Active theme (all colour tokens) — same file the main window uses. -->
  <link rel="stylesheet" id="themeStylesheet" href="../styles/theme-default.css"/>
  <link rel="stylesheet" href="../styles/signals.css"/><!-- AFTER the theme: operational signals are not themeable -->
  <link rel="stylesheet" href="../styles/dashboard.css"/>
  <!-- Shared intel badges (.intel-tag / .intel-band-* / .intel-role-*) used by
       the Early Warning widget when it is mirrored into this shell. -->
  <link rel="stylesheet" href="../styles/fc.css"/>
  <link rel="stylesheet" href="../styles/glass.css"/>
  <link rel="stylesheet" href="../styles/widget-window.css"/>
  <script>
  (function () {
    try {
      var t = JSON.parse(localStorage.getItem('eve-theme-css') || 'null');
      var link = document.getElementById('themeStylesheet');
      var GONE = { 'theme-carbon.css': 1, 'theme-sirius.css': 1 };
      if (t && link && !(t.file && GONE[t.file])) {
        if (t.file)      link.setAttribute('href', '../styles/' + t.file);
        else if (t.path) link.setAttribute('href', 'file:///' + encodeURI(t.path.replace(/\\/g, '/')));
      }
    } catch (e) {}
  })();
  </script>
</head>
<body>
  <!-- Glass mode + resolved tint, shared with the main window via localStorage -->
  <script>
  (function () {
    try {
      var g = JSON.parse(localStorage.getItem('eve-glass') || 'null');
      if (!g || g.enabled !== false) {
        document.body.classList.add('glass-on');
        var r = document.documentElement.style;
        if (g && g._surfaceRgb)       r.setProperty('--glass-tint-rgb',   g._surfaceRgb);
        if (g && g.tintAlpha != null) r.setProperty('--glass-tint-alpha', g.tintAlpha);
        if (g && g.bgAlpha  != null)  r.setProperty('--glass-bg-alpha',   g.bgAlpha);
        if (g && g.blurScale != null) r.setProperty('--glass-blur-scale', g.blurScale);
      }
    } catch (e) {}
  })();
  </script>

  <div class="pw-titlebar">
    <span class="material-symbols-outlined pw-icon" id="pwIcon" style="display:none;"></span>
    <span class="pw-title" id="pwTitle">WIDGET</span>
    <!-- Mirrors the widget's own status lamp while collapsed. Empty, and
         invisible, for widgets that have no lamp to mirror. -->
    <span class="pw-nano-light" id="pwNanoLight"></span>
    <button class="pw-btn" id="pwNanoBtn" title="Nano mode — collapse to the title bar">
      <span class="material-symbols-outlined">unfold_less</span>
    </button>
    <button class="pw-btn" id="pwPinBtn" title="Keep on top">
      <span class="material-symbols-outlined">keep</span>
    </button>
    <button class="pw-btn" id="pwPopInBtn" title="Return to dashboard">
      <span class="material-symbols-outlined">close_fullscreen</span>
    </button>
  </div>

  <div class="pw-content" id="pwContent">
    <div class="pw-empty">Connecting to dashboard…</div>
  </div>

  <script>
  (function () {
    const params   = new URLSearchParams(location.search);
    const widgetId = params.get('id')    || '';
    const title    = params.get('title') || 'WIDGET';

    document.getElementById('pwTitle').textContent = title;
    document.title = `EVE Carbon — ${title}`;

    // Collapsed, the bar is all there is — so carry the widget's status lamp up
    // into it. A nano strip parked over the game that says only "BEEHIVE
    // STATUS" is a bookmark; the same strip showing the lamp answers the
    // question you popped the widget out to watch, in the space of a title.
    // Widgets with no .sig-light simply get nothing, and the slot collapses.
    function syncNanoLight() {
      const slot = document.getElementById('pwNanoLight');
      const lamp = document.querySelector('#pwContent .sig-light');
      slot.textContent = '';
      if (!lamp) return;
      const dot = lamp.cloneNode(true);
      // Its own classes carry the colour; strip layout ones the bar sets itself.
      dot.removeAttribute('style');
      slot.appendChild(dot);
    }

    // Live content pushed from the dashboard (via main process relay)
    window.eveAPI?.onWidgetContent?.((data) => {
      if (!data || data.id !== widgetId) return;
      if (data.title) document.getElementById('pwTitle').textContent = data.title;
      document.getElementById('pwContent').innerHTML =
        data.html || '<div class="pw-empty">Widget is empty.</div>';
      // Re-cloned on every push, so a lamp that changes colour changes here too
      // rather than freezing at whatever it was when nano was switched on.
      syncNanoLight();
    });

    // Pin (always-on-top) toggle
    let pinned = false;
    document.getElementById('pwPinBtn').addEventListener('click', () => {
      pinned = !pinned;
      document.getElementById('pwPinBtn').classList.toggle('pinned', pinned);
      window.eveAPI?.widgetPopoutPin?.({ id: widgetId, pinned });
    });

    // Nano mode — collapse to the title bar to sit over the game
    let nano = false;
    const nanoBtn = document.getElementById('pwNanoBtn');
    nanoBtn.addEventListener('click', () => {
      nano = !nano;
      document.body.classList.toggle('nano', nano);
      nanoBtn.classList.toggle('pinned', nano);
      nanoBtn.title = nano ? 'Expand' : 'Nano mode — collapse to the title bar';
      nanoBtn.querySelector('.material-symbols-outlined').textContent =
        nano ? 'unfold_more' : 'unfold_less';
      if (nano) syncNanoLight();
      // Measure AFTER the class lands: the bar tightens its own padding in nano,
      // so measuring first would reserve a few pixels that are no longer there.
      const bar = document.querySelector('.pw-titlebar');
      window.eveAPI?.widgetPopoutNano?.({
        id: widgetId, nano, barHeight: bar ? bar.getBoundingClientRect().height : 34,
      });
    });

    // Pop back into the dashboard (window close does the same)
    document.getElementById('pwPopInBtn').addEventListener('click', () => {
      window.eveAPI?.widgetPopoutClose?.(widgetId);
    });

    // Tell the dashboard we're ready for the first push
    window.eveAPI?.widgetPopoutReady?.(widgetId);
  })();
  </script>
</body>
</html>
